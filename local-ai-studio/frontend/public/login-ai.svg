<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="ring" x1="60" y1="40" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6aa8b5"/>
      <stop offset="55%" stop-color="#6d3bb8"/>
      <stop offset="100%" stop-color="#4a1a7a"/>
    </linearGradient>
    <linearGradient id="lens" x1="140" y1="120" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6aa8b5" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#4a1a7a" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#6d3bb8" stop-opacity=".22"/>
      <stop offset="70%" stop-color="#6aa8b5" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#6aa8b5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ambient glow (transparent outside) -->
  <circle cx="210" cy="210" r="190" fill="url(#glow)"/>

  <!-- neural constellation -->
  <g stroke="#6d3bb8" stroke-opacity=".35" stroke-width="1.4">
    <path d="M70 118 L118 96 L152 140 L198 112 L236 148"/>
    <path d="M86 286 L132 258 L168 302 L214 274 L268 312"/>
    <path d="M318 88 L348 132 L312 168 L356 206"/>
    <path d="M58 198 L96 226 L74 262"/>
  </g>
  <g fill="#6d3bb8">
    <circle cx="70" cy="118" r="4" fill-opacity=".55"/>
    <circle cx="118" cy="96" r="3.5" fill-opacity=".45"/>
    <circle cx="152" cy="140" r="5" fill-opacity=".6"/>
    <circle cx="198" cy="112" r="3.5" fill-opacity=".4"/>
    <circle cx="236" cy="148" r="4" fill-opacity=".5"/>
    <circle cx="86" cy="286" r="4" fill-opacity=".45"/>
    <circle cx="132" cy="258" r="5" fill-opacity=".55"/>
    <circle cx="168" cy="302" r="3.5" fill-opacity=".4"/>
    <circle cx="214" cy="274" r="4.5" fill-opacity=".5"/>
    <circle cx="268" cy="312" r="3.5" fill-opacity=".4"/>
    <circle cx="318" cy="88" r="4" fill-opacity=".5"/>
    <circle cx="348" cy="132" r="5" fill-opacity=".55"/>
    <circle cx="312" cy="168" r="3.5" fill-opacity=".4"/>
    <circle cx="356" cy="206" r="4" fill-opacity=".45"/>
    <circle cx="58" cy="198" r="3.5" fill-opacity=".4"/>
    <circle cx="96" cy="226" r="4.5" fill-opacity=".5"/>
    <circle cx="74" cy="262" r="3.5" fill-opacity=".4"/>
  </g>
  <g fill="#6aa8b5">
    <circle cx="340" cy="280" r="3.5" fill-opacity=".45"/>
    <circle cx="360" cy="250" r="3" fill-opacity=".35"/>
    <circle cx="300" cy="330" r="3" fill-opacity=".35"/>
  </g>

  <!-- film strip arc -->
  <g transform="translate(210 210) rotate(-28)">
    <rect x="-168" y="-18" width="336" height="36" rx="6" fill="#4a1a7a" fill-opacity=".18" stroke="#6d3bb8" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#fff" fill-opacity=".55">
      <rect x="-150" y="-8" width="5" height="5" rx="1"/>
      <rect x="-150" y="3" width="5" height="5" rx="1"/>
      <rect x="145" y="-8" width="5" height="5" rx="1"/>
      <rect x="145" y="3" width="5" height="5" rx="1"/>
    </g>
    <g stroke="#6aa8b5" stroke-opacity=".65" stroke-width="1.5">
      <rect x="-120" y="-10" width="42" height="20" rx="3" fill="#6d3bb8" fill-opacity=".25"/>
      <rect x="-68" y="-10" width="42" height="20" rx="3" fill="#6aa8b5" fill-opacity=".2"/>
      <rect x="-16" y="-10" width="42" height="20" rx="3" fill="#6d3bb8" fill-opacity=".25"/>
      <rect x="36" y="-10" width="42" height="20" rx="3" fill="#6aa8b5" fill-opacity=".2"/>
      <rect x="88" y="-10" width="42" height="20" rx="3" fill="#6d3bb8" fill-opacity=".25"/>
    </g>
  </g>

  <!-- camera / lens mark -->
  <circle cx="210" cy="210" r="78" stroke="url(#ring)" stroke-width="10" fill="#ffffff" fill-opacity=".06"/>
  <circle cx="210" cy="210" r="58" stroke="#6aa8b5" stroke-opacity=".7" stroke-width="4" fill="url(#lens)" fill-opacity=".35"/>
  <circle cx="210" cy="210" r="34" fill="#2a1248" fill-opacity=".55" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="210" cy="210" r="14" fill="#6aa8b5" fill-opacity=".85"/>
  <circle cx="202" cy="202" r="5" fill="#fff" fill-opacity=".55"/>

  <!-- spark accents -->
  <g fill="#6aa8b5" fill-opacity=".7">
    <path d="M292 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M128 318 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
  </g>
</svg>
